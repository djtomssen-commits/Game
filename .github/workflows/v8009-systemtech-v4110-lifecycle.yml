name: V8.009 Systemtechnik V4110 Lifecycle
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_systemtech_v4110_lifecycle.py'
      - '.github/workflows/v8009-systemtech-v4110-lifecycle.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_systemtech_v4110_lifecycle.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html V8009_SYSTEMTECH_V4110_LIFECYCLE_QA.json
          git commit -m "V8.009 SYSTEMTECH: retire v4110 startup fanout" || exit 0
          git push
