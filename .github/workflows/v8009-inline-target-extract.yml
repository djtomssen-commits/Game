name: V8.009 Inline Target Extract
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_inline_target_extract.py'
      - '.github/workflows/v8009-inline-target-extract.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_inline_target_extract.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_INLINE_TARGET_EXTRACT.json
          git commit -m "V8.009 INLINE: record target extract" || exit 0
          git push
