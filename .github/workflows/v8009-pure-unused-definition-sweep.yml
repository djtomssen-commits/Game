name: V8.009 Pure Unused Definition Sweep
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_pure_unused_definition_sweep.py'
      - '.github/workflows/v8009-pure-unused-definition-sweep.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_pure_unused_definition_sweep.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_PURE_UNUSED_DEFINITION_SWEEP.json
          git commit -m "V8.009 AUDIT: pure unused definition sweep" || exit 0
          git pull --rebase origin main
          git push
