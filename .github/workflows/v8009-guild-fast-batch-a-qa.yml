name: V8.009 Guild Fast Batch A QA
on:
  push:
    branches: [main]
    paths:
      - 'js/features/guild/beta/v8008-c25-guildoverview-owner.js'
      - 'js/features/guild/beta/v8008-c25-guildwar-owner.js'
      - 'js/features/guild/beta/v8008-c25-guildchat-owner.js'
      - '.github/scripts/v8009_guild_fast_batch_a_qa.py'
      - '.github/workflows/v8009-guild-fast-batch-a-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check js/features/guild/beta/v8008-c25-guildoverview-owner.js
          node --check js/features/guild/beta/v8008-c25-guildwar-owner.js
          node --check js/features/guild/beta/v8008-c25-guildchat-owner.js
      - run: python3 .github/scripts/v8009_guild_fast_batch_a_qa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_GUILD_FAST_BATCH_A_QA.json
          git commit -m "V8.009 GUILD: record fast batch A QA" || exit 0
          git push
