name: V8.009 Character Attr Talent Patch Context
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_character_attr_talent_patch_context.py'
      - '.github/workflows/v8009-character-attr-talent-patch-context.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_character_attr_talent_patch_context.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_CHARACTER_ATTR_TALENT_PATCH_CONTEXT.json
          git commit -m "V8.009 CHARACTER: record attr talent patch context" || exit 0
          git pull --rebase origin main
          git push
