name: V8.009 PvP Inspect v6290

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_pvp_extract_v6290.py'
      - '.github/workflows/v8009-pvp-extract-v6290.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_pvp_extract_v6290.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_PVP_V6290_BODY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 PVP: inspect v6290 Hall performance owner"
          git push
