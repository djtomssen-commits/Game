name: V8.009 Character Fast QA AB
on:
  push:
    branches: [main]
    paths:
      - 'beta.html'
      - '.github/scripts/v8009_character_fast_qa_ab.py'
      - '.github/workflows/v8009-character-fast-qa-ab.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_character_fast_qa_ab.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_CHARACTER_FAST_QA_AB.json
          git commit -m "V8.009 CHARACTER: record fast QA AB" || exit 0
          git push
