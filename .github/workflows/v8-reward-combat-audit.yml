name: V8 Reward and Combat Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8_reward_combat_audit.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8_reward_combat_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8_REWARD_COMBAT_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit reward feedback and combat cadence"
          git push
