name: V8.009 Boss UI Fast Patch B
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_boss_ui_fast_patch_b.py'
      - '.github/workflows/v8009-boss-ui-fast-patch-b.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_boss_ui_fast_patch_b.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html V8009_BOSS_UI_FAST_QA_B.json
          git commit -m "V8.009 BOSS: make pageshow repaint direct" || exit 0
          git push
