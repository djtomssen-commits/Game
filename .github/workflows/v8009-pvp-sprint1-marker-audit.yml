name: V8.009 PvP Sprint 1 Marker Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_pvp_sprint1_marker_audit.py'
      - '.github/workflows/v8009-pvp-sprint1-marker-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_pvp_sprint1_marker_audit.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_PVP_SPRINT1_MARKER_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 PVP-SPRINT-1: audit marker-only cores"
          git push
