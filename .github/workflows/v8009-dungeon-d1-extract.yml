name: V8.009 Dungeon D1 Extraction

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_dungeon_d1_extract.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract canonical combat owner from beta HTML
        run: python3 .github/scripts/v8009_dungeon_d1_extract.py
      - name: Syntax-check extracted combat renderer
        run: node --check js/features/dungeon/beta/v8009-d1-combat-renderer.js
      - name: Validate D1 extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          beta=Path('beta.html').read_text(encoding='utf-8')
          stable=Path('index.html').read_text(encoding='utf-8')
          r=json.loads(Path('V8009_DUNGEON_D1_BETA.json').read_text(encoding='utf-8'))
          js='js/features/dungeon/beta/v8009-d1-combat-renderer.js'
          css='css/features/dungeon/beta/v8009-d1-combat-renderer.css'
          if beta.count(js)!=1: raise SystemExit('D1 JS include count is not 1')
          if beta.count(css)!=1: raise SystemExit('D1 CSS include count is not 1')
          if js in stable or css in stable: raise SystemExit('stable unexpectedly loads beta D1 files')
          if '<script id="v7175-combat-renderer-core">' in beta: raise SystemExit('inline D1 JS remains')
          if '<style id="v7175-combat-renderer-css">' in beta: raise SystemExit('inline D1 CSS remains')
          if not r.get('stable_unchanged'): raise SystemExit('stable changed flag')
          if r.get('gameplay_changed') or r.get('server_authority_changed'): raise SystemExit('scope violation')
          print('DUNGEON-D1 extraction OK')
          PY
      - name: Diff sanity
        run: git diff --check
      - name: Commit D1 extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html js/features/dungeon/beta/v8009-d1-combat-renderer.js css/features/dungeon/beta/v8009-d1-combat-renderer.css V8009_DUNGEON_D1_BETA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 DUNGEON-D1: extract canonical combat renderer"
          git push
