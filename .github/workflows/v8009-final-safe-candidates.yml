name: V8.009 Final Safe Candidates
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_final_safe_candidates.py'
      - '.github/workflows/v8009-final-safe-candidates.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_final_safe_candidates.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_FINAL_SAFE_CANDIDATES.json
          git commit -m "V8.009 FINAL: record safe lifecycle candidates" || exit 0
          git pull --rebase origin main
          git push
