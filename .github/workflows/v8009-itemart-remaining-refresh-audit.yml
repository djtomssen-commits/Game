name: V8.009 ItemArt Remaining Refresh Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_itemart_remaining_refresh_audit.py'
      - '.github/workflows/v8009-itemart-remaining-refresh-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_itemart_remaining_refresh_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_ITEMART_REMAINING_REFRESH_AUDIT.json
          git commit -m "V8.009 ITEMART: record remaining refresh audit" || exit 0
          git push
