name: V8.009 Tower Fast Batch A QA
on:
  push:
    branches: [main]
    paths:
      - 'js/features/tower/beta/v8009-t1-tower-entry.js'
      - 'js/features/tower/beta/v8009-t1-tower-system.js'
      - '.github/scripts/v8009_tower_fast_batch_a_qa.py'
      - '.github/workflows/v8009-tower-fast-batch-a-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check js/features/tower/beta/v8009-t1-tower-entry.js
          node --check js/features/tower/beta/v8009-t1-tower-system.js
      - run: python3 .github/scripts/v8009_tower_fast_batch_a_qa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_TOWER_FAST_BATCH_A_QA.json
          git commit -m "V8.009 TOWER: record fast batch A QA" || exit 0
          git push
