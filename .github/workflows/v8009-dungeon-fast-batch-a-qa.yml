name: V8.009 Dungeon Fast Batch A QA
on:
  push:
    branches: [main]
    paths:
      - 'js/features/dungeon/beta/v8009-d2-map-finalizer.js'
      - 'js/features/dungeon/beta/v8009-d2-detail-render-lock.js'
      - 'js/features/dungeon/beta/v8009-d5-final-detail-seal.js'
      - '.github/scripts/v8009_dungeon_fast_batch_a_qa.py'
      - '.github/workflows/v8009-dungeon-fast-batch-a-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check js/features/dungeon/beta/v8009-d2-map-finalizer.js
          node --check js/features/dungeon/beta/v8009-d2-detail-render-lock.js
          node --check js/features/dungeon/beta/v8009-d5-final-detail-seal.js
      - run: python3 .github/scripts/v8009_dungeon_fast_batch_a_qa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_DUNGEON_FAST_BATCH_A_QA.json
          git commit -m "V8.009 DUNGEON: record fast batch A QA" || exit 0
          git push
