name: V8.009 Guild Power Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_guild_power_audit.py'
      - '.github/workflows/v8009-guild-power-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_guild_power_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_GUILD_POWER_AUDIT.json
          git commit -m "V8.009 AUDIT: guild full-tab lifecycle inventory" || exit 0
          git pull --rebase origin main
          git push

