name: V8.009 Quest v7046 Retry QA
on:
  push:
    branches: [main]
    paths:
      - 'js/features/quest/beta/v7046-quest-event-duplicate-reward-guard.js'
      - '.github/scripts/v8009_quest_v7046_retry_qa.py'
      - '.github/workflows/v8009-quest-v7046-retry-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check js/features/quest/beta/v7046-quest-event-duplicate-reward-guard.js
      - run: python3 .github/scripts/v8009_quest_v7046_retry_qa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_V7046_RETRY_QA.json
          git commit -m "V8.009 QUEST: record v7046 retry QA" || exit 0
          git push
