name: V8.009 Guildboss Direct Owner Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_guildboss_direct_owner_audit.py'
      - '.github/workflows/v8009-guildboss-direct-owner-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_guildboss_direct_owner_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_GUILDBOSS_DIRECT_OWNER_AUDIT.json
          git commit -m "V8.009 GUILD: record guildboss direct owner audit" || exit 0
          git push