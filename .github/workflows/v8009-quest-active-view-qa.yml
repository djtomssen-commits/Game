name: V8.009 Quest Active View Flicker QA
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_quest_active_view_qa.py'
      - 'js/features/quest/beta/v392-single-active-quest-script.js'
      - 'js/features/quest/beta/v386-quest-redesign-script.js'
      - 'js/features/quest/beta/v6344-quest-variety-js.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check js/features/quest/beta/v392-single-active-quest-script.js
          node --check js/features/quest/beta/v386-quest-redesign-script.js
          node --check js/features/quest/beta/v6344-quest-variety-js.js
      - name: Contract
        run: python3 .github/scripts/v8009_quest_active_view_qa.py
      - name: Commit QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_ACTIVE_VIEW_QA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 QUEST: record active view flicker QA"
          git push
