name: V8.009 Character Material Tab Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_character_material_tab_audit.py'
      - '.github/workflows/v8009-character-material-tab-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_character_material_tab_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_CHARACTER_MATERIAL_TAB_AUDIT.json
          git commit -m "V8.009 CHARACTER: record material tab performance audit" || exit 0
          git pull --rebase origin main
          git push