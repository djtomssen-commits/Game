name: V8.378 one-time Server1 worldboss cache refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v8378-server1-worldboss-cache.yml'
permissions:
  contents: write
jobs:
  refresh-server1-worldboss-cache:
    if: contains(github.event.head_commit.message, 'V8.378 trigger Server1 worldboss cache refresh')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update original Server1 entrypoint worldboss cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server1.html')
          s = p.read_text(encoding='utf-8')
          needle = 'js/features/worldboss/beta/v8009-s5-v291-worldboss-upgrades-balance.js'
          target = needle + '?v=8378-worldboss-full-upgrades-server1'
          if target not in s:
              assert s.count(needle) == 1, 'Expected one original worldboss script'
              s = s.replace(needle, target)
              p.write_text(s, encoding='utf-8')
          assert target in p.read_text(encoding='utf-8')
          assert 'GROW_RELEASE_CHANNEL' in Path('js/features/worldboss/beta/v8009-s5-v291-worldboss-upgrades-balance.js').read_text(encoding='utf-8')
          print('Server1 original worldboss file version updated; Beta unchanged')
          PY
      - name: Commit canonical Server1 cache key
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server1.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V8.378 Server1 worldboss preview cache refresh (no balance override)'
          git push
