name: V8 Guild combat browser QA

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8_guild_combat_browser_qa.mjs'
      - '.github/workflows/v8-guild-combat-browser-qa.yml'
      - 'js/features/guild/legacy/01-v255-daily-guild-boss-core.js'
      - 'js/features/guild/legacy/04-v260-real-daily-guild-boss.js'
      - 'js/features/guild/legacy/05-v262-guild-war-core--v263-guild-war-final.js'
      - 'js/features/guild/legacy/09-v4159-guild-war-authority.js'
      - 'js/features/guild/legacy/40-v6307-guildboss-multiexchange-script.js'
      - 'js/features/guild/legacy/44-v6321-guildboss-combat-animation-script.js'
      - 'js/features/guild/legacy/47-v6209-guildboss-replay-performance-script.js'
      - 'css/features/guild/legacy/v6321-guildboss-combat-animation-css.css'
      - 'js/features/guild/beta/v8008-c6-guild-overview-owner.js'
      - 'js/features/guild/beta/v8008-c7-guildboss-replay-owner.js'
      - 'js/features/guild/beta/v8008-c8-guildboss-pre-replay-visual-owner.js'
      - 'js/features/guild/beta/v8008-c8-guildboss-post-replay-arena-owner.js'

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run Guild Boss + Guild War browser QA
        run: node .github/scripts/v8_guild_combat_browser_qa.mjs
