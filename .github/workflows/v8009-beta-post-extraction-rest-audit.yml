name: V8.009 Beta Post Extraction Rest Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_beta_post_extraction_rest_audit.py'
      - '.github/workflows/v8009-beta-post-extraction-rest-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_beta_post_extraction_rest_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_BETA_POST_EXTRACTION_REST_AUDIT.json
          git commit -m "V8.009 AUDIT: post extraction beta rest inventory" || exit 0
          git pull --rebase origin main
          git push
