name: V8.009 Dungeon Key Consolidation QA
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_dungeon_key_consolidation_qa.py'
      - '.github/workflows/v8009-dungeon-key-consolidation-qa.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_dungeon_key_consolidation_qa.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_DUNGEON_KEY_CONSOLIDATION_QA.json
          git commit -m "V8.009 QA: dungeon key consolidation" || exit 0
          git pull --rebase origin main
          git push
