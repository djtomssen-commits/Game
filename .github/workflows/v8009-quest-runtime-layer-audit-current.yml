name: V8.009 Quest Runtime Layer Audit Current
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_quest_runtime_layer_audit_current.py'
      - '.github/workflows/v8009-quest-runtime-layer-audit-current.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_quest_runtime_layer_audit_current.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_RUNTIME_LAYER_AUDIT_CURRENT.json
          git commit -m "V8.009 QUEST: record current runtime audit" || exit 0
          git push
