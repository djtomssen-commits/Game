name: V8.009 PvP Sprint 1 Retire v6290

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_pvp_sprint1_retire_v6290.py'
      - '.github/workflows/v8009-pvp-sprint1-retire-v6290.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retire v6290 wrapper
        run: python3 .github/scripts/v8009_pvp_sprint1_retire_v6290.py
      - name: Validate direct Hall decoration
        run: |
          node --check js/features/pvp/beta/v8009-s1-v6145-hall-pagination-js.js
          node --check js/features/pvp/beta/v8009-s1-v326-hall-profile-canonical.js
          node --check js/features/pvp/beta/v8009-s1-v646-hall-template-js.js
          node --check js/features/pvp/legacy/v8009-s1-retired-v6290-performance-hall-fix.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          beta=Path('beta.html').read_text(encoding='utf-8',errors='ignore')
          hall=Path('js/features/pvp/beta/v8009-s1-v6145-hall-pagination-js.js').read_text(encoding='utf-8')
          own=Path('js/features/pvp/beta/v8009-s1-v326-hall-profile-canonical.js').read_text(encoding='utf-8')
          if re.search(r'<script[^>]*id=["\']v6290-performance-hall-fix-js["\']',beta,re.I):
              raise SystemExit('v6290 still active')
          if 'decorateHall();' not in hall or 'window.v646DecorateHall?.()' not in hall:
              raise SystemExit('v6145 direct Hall decoration missing')
          if 'window.v646DecorateHall?.()' not in own:
              raise SystemExit('v326 direct Hall decoration missing')
          print('v6290 retirement direct-hook QA OK')
          PY
      - name: Diff sanity
        run: git diff --check
      - name: Commit retirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html js/features/pvp/legacy/v8009-s1-retired-v6290-performance-hall-fix.js V8009_PVP_SPRINT1_V6290_RETIREMENT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 PVP-SPRINT-1: retire v6290 Hall wrapper"
          git push
