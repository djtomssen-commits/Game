name: V8.379 Quest Beta latency validation and cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v8379-quest-beta-latency-cache.yml'
permissions:
  contents: write
jobs:
  validate-and-cache:
    if: contains(github.event.head_commit.message, 'V8.379 initiate Beta quest latency QA and cache')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original quest owner and no duplicate payouts
        run: node qa/v8379-quest-latency-guard.mjs
      - name: Update original Beta entrypoint cache key (Server1 unchanged)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('beta.html')
          s=p.read_text(encoding='utf-8')
          needle='js/features/quest/beta/v7045-atomic-quest-receipt-client.js'
          target=needle+'?v=8379-quest-overlap-ack-beta'
          if target not in s:
              assert s.count(needle)==1, 'Expected one original client script'
              s=s.replace(needle,target)
              p.write_text(s,encoding='utf-8')
          assert target in p.read_text(encoding='utf-8')
          assert '8379-quest-overlap-ack-beta' not in Path('server1.html').read_text(encoding='utf-8')
          PY
      - name: Commit Beta entrypoint change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beta.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V8.379 Beta quest latency source cache refresh'
          git push
