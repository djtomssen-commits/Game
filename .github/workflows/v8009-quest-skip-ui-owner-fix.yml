name: V8.009 Quest Skip UI Owner Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_quest_skip_ui_owner_fix.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate quest skip UI owner
        run: python3 .github/scripts/v8009_quest_skip_ui_owner_fix.py
      - name: Validate Stable unchanged
        run: git diff --exit-code HEAD -- index.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html V8009_QUEST_SKIP_UI_OWNER_FIX.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 QUEST: consolidate skip UI owner"
          git push
