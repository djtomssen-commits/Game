name: V8.009 Presentation Render Wrapper Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_presentation_render_wrapper_audit.py'
      - '.github/workflows/v8009-presentation-render-wrapper-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_presentation_render_wrapper_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_PRESENTATION_RENDER_WRAPPER_AUDIT.json
          git commit -m "V8.009 AUDIT: presentation render wrappers" || exit 0
          git pull --rebase origin main
          git push
