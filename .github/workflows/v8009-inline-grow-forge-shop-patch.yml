name: V8.009 Inline Grow Forge Shop Patch
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_inline_grow_forge_shop_patch.py'
      - '.github/workflows/v8009-inline-grow-forge-shop-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_inline_grow_forge_shop_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html
          git commit -m "V8.009 INLINE: consolidate grow forge shop lifecycles" || exit 0
          git push
