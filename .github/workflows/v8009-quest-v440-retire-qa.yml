name: V8.009 Quest v440 Beta Retire QA
on:
  push:
    branches: [main]
    paths:
      - 'js/features/guild/legacy/18-v440-quest-guild-xp-final-owner.js'
      - '.github/scripts/v8009_quest_v440_retire_qa.py'
      - '.github/workflows/v8009-quest-v440-retire-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check js/features/guild/legacy/18-v440-quest-guild-xp-final-owner.js
          node --check js/features/guild/legacy/20-v474-guild-home-authority-script.js
          node --check js/features/quest/beta/v7045-atomic-quest-receipt-client.js
      - name: Contract
        run: python3 .github/scripts/v8009_quest_v440_retire_qa.py
      - name: Commit QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_V440_BETA_RETIRE_QA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 QUEST: record v440 beta retire QA"
          git push
