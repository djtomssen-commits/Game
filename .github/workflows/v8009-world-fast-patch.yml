name: V8.009 World Fast Patch
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_world_fast_patch.py'
      - '.github/workflows/v8009-world-fast-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_world_fast_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html
          git commit -m "V8.009 WORLD: retire v357 navigation repaint layer" || exit 0
          git push
