name: V8.009 Shop Extraction Batch 1
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_shop_extraction_batch1.py'
      - '.github/workflows/v8009-shop-extraction-batch1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_shop_extraction_batch1.py
      - run: |
          node --check js/features/shop/beta/v8009-s1-v466-all-item-art-purchase-fix.js
          node --check js/features/shop/beta/v8009-s1-v6105-item-variety-and-art-rework.js
          node --check js/features/shop/beta/v8009-s1-v7063-server-shop-forge-auto-bridge.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add beta.html js/features/shop/beta/v8009-s1-v466-all-item-art-purchase-fix.js js/features/shop/beta/v8009-s1-v6105-item-variety-and-art-rework.js js/features/shop/beta/v8009-s1-v7063-server-shop-forge-auto-bridge.js V8009_SHOP_EXTRACTION_BATCH1_QA.json
          git commit -m "V8.009 SHOP: extract first owner batch" || exit 0
          git pull --rebase origin main
          git push