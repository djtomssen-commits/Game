name: V8.009 Anonymous Inline Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_anonymous_inline_audit.py'
      - '.github/workflows/v8009-anonymous-inline-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_anonymous_inline_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_ANONYMOUS_INLINE_AUDIT.json
          git commit -m "V8.009 FINAL: record anonymous inline audit" || exit 0
          git pull --rebase origin main
          git push
