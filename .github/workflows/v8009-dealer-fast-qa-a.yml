name: V8.009 Dealer Fast QA A
on:
  push:
    branches: [main]
    paths:
      - 'beta.html'
      - '.github/scripts/v8009_dealer_fast_qa_a.py'
      - '.github/workflows/v8009-dealer-fast-qa-a.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_dealer_fast_qa_a.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_DEALER_FAST_QA_A.json
          git commit -m "V8.009 DEALER: record fast QA A" || exit 0
          git push
