name: V8.009 CSS Consolidation Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_css_consolidation_audit.py'
      - '.github/workflows/v8009-css-consolidation-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_css_consolidation_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_CSS_CONSOLIDATION_AUDIT.json
          git commit -m "V8.009 AUDIT: css consolidation inventory" || exit 0
          git pull --rebase origin main
          git push
