name: V8.009 Dungeon D12 Retire v461 CSS

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_dungeon_d12_retire_v461_css.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retire fully redundant v461 D1 CSS
        run: python3 .github/scripts/v8009_dungeon_d12_retire_v461_css.py
      - name: Validate D12 retirement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          beta=Path('beta.html').read_text(encoding='utf-8')
          report=json.loads(Path('V8009_DUNGEON_D12_BETA.json').read_text(encoding='utf-8'))
          href='css/features/dungeon/beta/v8009-d11-v461-d1-node9-collision-fix.css'
          if href in beta: raise SystemExit('v461 CSS still active')
          if not Path(href).exists(): raise SystemExit('v461 CSS file not retained')
          if not report['proof']['fully_redundant']: raise SystemExit('redundancy proof missing')
          for ref in (
            'css/features/dungeon/beta/v8009-d11-v463-d1-screenshot-polish.css',
            'css/features/dungeon/beta/v8009-d11-v464-d1-boss-micro-position.css',
            'js/features/dungeon/beta/v8009-d8-detail-decorator.js',
            'js/features/dungeon/beta/v8009-d2-visual-owner.js',
            'js/features/dungeon/beta/v8009-d5-final-detail-seal.js',
          ):
              if beta.count(ref)!=1: raise SystemExit(f'include count regression: {ref}')
          print('DUNGEON-D12 v461 retirement OK')
          PY
      - name: Diff sanity
        run: git diff --check
      - name: Commit D12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html V8009_DUNGEON_D12_BETA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 DUNGEON-D12: retire redundant v461 D1 CSS"
          git push
