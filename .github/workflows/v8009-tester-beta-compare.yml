name: V8.009 Tester Beta Compare
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_tester_beta_compare.py'
      - '.github/workflows/v8009-tester-beta-compare.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_tester_beta_compare.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_TESTER_BETA_COMPARE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009: compare tester and beta entry builds"
          git push
