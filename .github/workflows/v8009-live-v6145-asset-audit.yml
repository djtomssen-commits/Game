name: V8.009 Live v6145 Asset Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_live_v6145_asset_audit.py'
      - '.github/workflows/v8009-live-v6145-asset-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_live_v6145_asset_audit.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_LIVE_V6145_ASSET_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009: audit live v6145 Beta asset"
          git push
