name: V8.009 Quest Shift Final QA
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_quest_shift_final_qa.py'
      - '.github/workflows/v8009-quest-shift-final-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_quest_shift_final_qa.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_QUEST_SHIFT_FINAL_QA.json
          git commit -m "V8.009 QA: quest shift power block" || exit 0
          git pull --rebase origin main
          git push
