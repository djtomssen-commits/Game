name: V8.009 Mini CSS Classification
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_mini_css_classification.py'
      - '.github/workflows/v8009-mini-css-classification.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_mini_css_classification.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_MINI_CSS_CLASSIFICATION.json
          git commit -m "V8.009 AUDIT: classify mini css" || exit 0
          git pull --rebase origin main
          git push

