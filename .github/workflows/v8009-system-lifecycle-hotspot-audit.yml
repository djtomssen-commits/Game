name: V8.009 System Lifecycle Hotspot Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_system_lifecycle_hotspot_audit.py'
      - '.github/workflows/v8009-system-lifecycle-hotspot-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_system_lifecycle_hotspot_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_SYSTEM_LIFECYCLE_HOTSPOT_AUDIT.json
          git commit -m "V8.009 AUDIT: system lifecycle hotspot inventory" || exit 0
          git pull --rebase origin main
          git push

