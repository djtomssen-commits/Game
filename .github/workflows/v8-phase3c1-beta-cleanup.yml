name: V8 Phase 3C1 Beta guild cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8_phase3c1_beta_cleanup.py'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply beta-only guild cleanup
        run: python3 .github/scripts/v8_phase3c1_beta_cleanup.py
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          beta=Path('beta.html').read_text(encoding='utf-8')
          stable=Path('index.html').read_text(encoding='utf-8')
          for sid in ('v436-guild-xp-reliability','v479-guildxp-limit-ui-script','v555-guild-compact-final-js'):
              m=re.search(rf'<script\b[^>]*\bid=["\']{re.escape(sid)}["\'][^>]*>',beta,re.I)
              if not m: raise SystemExit(f'missing beta marker {sid}')
              if re.search(r'\bsrc=',m.group(0),re.I): raise SystemExit(f'{sid} still loads retired file in beta')
          if 'V8_PHASE3C1_STABLE_SHA256' not in Path('V8_PHASE3C1_BETA.json').read_text():
              raise SystemExit('report marker missing')
          print('Phase 3C1 validation OK')
          PY
      - name: Commit beta-only cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html V8_PHASE3C1_BETA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.008 beta Phase 3C1: remove retired guild stubs"
          git push
