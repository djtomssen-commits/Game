name: V8.009 Dungeon Quest Wrapper Ownership Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_dungeon_quest_wrapper_ownership_audit.py'
      - '.github/workflows/v8009-dungeon-quest-wrapper-ownership-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_dungeon_quest_wrapper_ownership_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_DUNGEON_QUEST_WRAPPER_OWNERSHIP_AUDIT.json
          git commit -m "V8.009 AUDIT: dungeon quest wrapper ownership" || exit 0
          git pull --rebase origin main
          git push
