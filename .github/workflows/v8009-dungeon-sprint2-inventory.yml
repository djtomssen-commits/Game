name: V8.009 Dungeon Sprint 2 Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_dungeon_sprint2_inventory.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Inventory active Dungeon layers
        run: python3 .github/scripts/v8009_dungeon_sprint2_inventory.py
      - name: Validate inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('V8009_DUNGEON_SPRINT2_INVENTORY.json').read_text(encoding='utf-8'))
          if not r['counts']['external_js']: raise SystemExit('no active external Dungeon JS found')
          if not r['counts']['external_css']: raise SystemExit('no active external Dungeon CSS found')
          print('Dungeon Sprint 2 inventory OK')
          PY
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_DUNGEON_SPRINT2_INVENTORY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 DUNGEON-SPRINT-2: inventory active Dungeon layers"
          git push
