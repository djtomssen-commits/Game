name: V8.009 Final Big Batch 19
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_final_big_batch19.py'
      - '.github/workflows/v8009-final-big-batch19.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_final_big_batch19.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add beta.html V8009_FINAL_BIG_BATCH19_QA.json
          git commit -m "V8.009 FINAL: retire menu itemart pet tutorial nav wrappers" || exit 0
          git pull --rebase origin main
          git push