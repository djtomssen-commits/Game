name: V8.009 Quest Local Claim Owner QA
on:
  push:
    branches: [main]
    paths:
      - 'js/features/quest/beta/v235-quest-reward-stability.js'
      - 'js/features/quest/beta/v240-rarity-quest-loot-core.js'
      - 'js/features/quest/beta/v4222-separate-elite-quest-script.js'
      - '.github/scripts/v8009_quest_local_claim_owner_qa.py'
      - '.github/workflows/v8009-quest-local-claim-owner-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check js/features/quest/beta/v235-quest-reward-stability.js
          node --check js/features/quest/beta/v240-rarity-quest-loot-core.js
          node --check js/features/quest/beta/v4222-separate-elite-quest-script.js
      - run: python3 .github/scripts/v8009_quest_local_claim_owner_qa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_LOCAL_CLAIM_OWNER_QA.json
          git commit -m "V8.009 QUEST: record local claim owner QA" || exit 0
          git push
