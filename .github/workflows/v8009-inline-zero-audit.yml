name: V8.009 Inline Zero Audit
on:
  push:
    branches: [main]
    paths:
      - 'beta.html'
      - 'v8009-extracted-v4114-grow-care-css.css'
      - '.github/scripts/v8009_inline_zero_audit.py'
      - '.github/workflows/v8009-inline-zero-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_inline_zero_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_INLINE_ZERO_AUDIT.json
          git commit -m "V8.009 AUDIT: verify zero inline js css" || exit 0
          git pull --rebase origin main
          git push
