name: V8.009 Shop Flicker Consolidation QA
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_shop_flicker_consolidation_qa.py'
      - '.github/workflows/v8009-shop-flicker-consolidation-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_shop_flicker_consolidation_qa.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_SHOP_FLICKER_CONSOLIDATION_QA.json
          git commit -m "V8.009 QA: shop flicker consolidation" || exit 0
          git pull --rebase origin main
          git push
