name: V8.009 Quest Push Chain QA
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_quest_push_chain_qa.py'
      - 'js/features/quest/beta/gl-quest-ready-push-v1.js'
      - 'js/features/quest/beta/v7110-quest-authority-sync.js'
      - 'js/features/quest/beta/v7045-atomic-quest-receipt-client.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check js/features/quest/beta/gl-quest-ready-push-v1.js
          node --check js/features/quest/beta/v7110-quest-authority-sync.js
          node --check js/features/quest/beta/v7045-atomic-quest-receipt-client.js
      - name: Contract
        run: python3 .github/scripts/v8009_quest_push_chain_qa.py
      - name: Commit QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_PUSH_CHAIN_QA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 QUEST: record push chain QA"
          git push
