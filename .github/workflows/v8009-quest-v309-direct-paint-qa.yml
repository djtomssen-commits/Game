name: V8.009 Quest v309 Direct Paint QA
on:
  push:
    branches: [main]
    paths:
      - 'js/features/quest/beta/v309-distinct-quest-offers.js'
      - 'js/features/quest/beta/v6344-quest-variety-js.js'
      - '.github/scripts/v8009_quest_v309_direct_paint_qa.py'
      - '.github/workflows/v8009-quest-v309-direct-paint-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check js/features/quest/beta/v309-distinct-quest-offers.js
          node --check js/features/quest/beta/v6344-quest-variety-js.js
      - run: python3 .github/scripts/v8009_quest_v309_direct_paint_qa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_V309_DIRECT_PAINT_QA.json
          git commit -m "V8.009 QUEST: record v309 direct-paint QA" || exit 0
          git push
