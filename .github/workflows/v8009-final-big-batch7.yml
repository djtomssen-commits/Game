name: V8.009 Final Big Batch 7
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_final_big_batch7.py'
      - '.github/workflows/v8009-final-big-batch7.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python3 .github/scripts/v8009_final_big_batch7.py
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add beta.html V8009_FINAL_BIG_BATCH7_QA.json
          git commit -m "V8.009 FINAL: retire remaining visual startup trains" || exit 0
          git pull --rebase origin main
          git push
