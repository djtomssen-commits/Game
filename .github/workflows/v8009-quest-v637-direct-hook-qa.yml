name: V8.009 Quest v637 Direct Hook QA
on:
  push:
    branches: [main]
    paths:
      - 'js/features/quest/beta/v637-quest-exact-dungeon-core.js'
      - 'js/features/quest/beta/v636-quest-dungeon-authority-core.js'
      - '.github/scripts/v8009_quest_v637_direct_hook_qa.py'
      - '.github/workflows/v8009-quest-v637-direct-hook-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check js/features/quest/beta/v637-quest-exact-dungeon-core.js
          node --check js/features/quest/beta/v636-quest-dungeon-authority-core.js
      - run: python3 .github/scripts/v8009_quest_v637_direct_hook_qa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_V637_DIRECT_HOOK_QA.json
          git commit -m "V8.009 QUEST: record v637 direct-hook QA" || exit 0
          git push
