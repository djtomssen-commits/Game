name: V8 Beta guild final audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8_beta_guild_final_audit.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8_beta_guild_final_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8_BETA_GUILD_FINAL_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit final beta guild runtime order"
          git push
