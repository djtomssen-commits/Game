name: V8.009 Precise Wrapper Mutation Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_precise_wrapper_mutation_audit.py'
      - '.github/workflows/v8009-precise-wrapper-mutation-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_precise_wrapper_mutation_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_PRECISE_WRAPPER_MUTATION_AUDIT.json
          git commit -m "V8.009 AUDIT: precise wrapper mutation inventory" || exit 0
          git pull --rebase origin main
          git push

