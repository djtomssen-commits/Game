name: V8.009 Dealer Small Screen Cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_dealer_small_screen_cleanup.py'
      - '.github/workflows/v8009-dealer-small-screen-cleanup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_dealer_small_screen_cleanup.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add beta.html V8009_DEALER_SMALL_SCREEN_QA.json
          git commit -m "V8.009 FINAL: retire dealer startup repaint layers" || exit 0
          git pull --rebase origin main
          git push