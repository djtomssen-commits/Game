name: V8.009 Quest Consolidation QA
on:
  push:
    branches: [main]
    paths:
      - 'js/features/quest/beta/**'
      - '.github/scripts/v8009_quest_consolidation_qa.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check quest JS
        run: |
          for f in js/features/quest/beta/*.js; do node --check "$f"; done
      - name: Run consolidation contract QA
        run: python3 .github/scripts/v8009_quest_consolidation_qa.py
      - name: Commit QA manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_CONSOLIDATION_QA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 QUEST: record consolidation QA"
          git push
