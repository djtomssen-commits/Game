name: V8 Phase 3C3 Beta guild overview owner
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8_phase3c3_beta_owner.py'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate beta guild overview owner
        run: python3 .github/scripts/v8_phase3c3_beta_owner.py
      - name: Validate owner chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          beta=Path('beta.html').read_text(encoding='utf-8')
          report=json.loads(Path('V8_PHASE3C3_BETA.json').read_text(encoding='utf-8'))
          if not report.get('stable_unchanged'):
              raise SystemExit('stable changed')
          for sid in ('v552-guild-grow-legends-js','v553-guild-strong-layout-js'):
              m=re.search(rf'<script\b[^>]*\bid=["\']{re.escape(sid)}["\'][^>]*>',beta,re.I)
              if not m: raise SystemExit(f'missing compatibility marker {sid}')
              if re.search(r'\bsrc=',m.group(0),re.I): raise SystemExit(f'{sid} still loads on beta')
          owner=re.search(r'<script\b[^>]*\bid=["\']v554-guild-reference-owner-js["\'][^>]*>',beta,re.I)
          if not owner or not re.search(r'\bsrc=',owner.group(0),re.I):
              raise SystemExit('v554 owner is not loaded on beta')
          print('Phase 3C3 owner validation OK')
          PY
      - name: Commit beta-only owner cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html V8_PHASE3C3_BETA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.008 beta Phase 3C3: make V5.54 sole guild overview owner"
          git push
