name: V8.009 Quest Sprint 1 Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_quest_sprint1_inventory.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inventory Quest layers
        run: python3 .github/scripts/v8009_quest_sprint1_inventory.py
      - name: Validate inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('V8009_QUEST_SPRINT1_INVENTORY.json').read_text(encoding='utf-8'))
          if r['counts']['inline_scripts']+r['counts']['external_js'] == 0:
              raise SystemExit('no Quest JS found')
          print('Quest Sprint 1 inventory OK')
          PY
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_SPRINT1_INVENTORY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 QUEST-SPRINT-1: inventory quest layers"
          git push
