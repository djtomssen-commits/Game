name: V8.009 Growroom Four Tab Final QA
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_growroom_four_tab_final_qa.py'
      - '.github/workflows/v8009-growroom-four-tab-final-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_growroom_four_tab_final_qa.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_GROWROOM_FOUR_TAB_FINAL_QA.json
          git commit -m "V8.009 QA: growroom four-tab power block" || exit 0
          git pull --rebase origin main
          git push
