name: V8.009 Legacy DOM Contract Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_legacy_dom_contract_audit.py'
      - '.github/workflows/v8009-legacy-dom-contract-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_legacy_dom_contract_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_LEGACY_DOM_CONTRACT_AUDIT.json
          git commit -m "V8.009 AUDIT: legacy DOM contracts and producer collisions" || exit 0
          git pull --rebase origin main
          git push

