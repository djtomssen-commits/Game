name: V8.009 System Extraction Batch 1
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_system_extraction_batch1.py'
      - '.github/workflows/v8009-system-extraction-batch1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_system_extraction_batch1.py
      - run: |
          node --check js/features/system/beta/v8009-s1-v4107-systemtechnik.js
          node --check js/features/system/beta/v8009-s1-v4102-qa-system.js
          node --check js/features/system/beta/v8009-s1-v4106-qa2-performance.js
          node --check js/features/system/beta/v8009-s1-gl-code-diag.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add beta.html js/features/system/beta/v8009-s1-v4107-systemtechnik.js js/features/system/beta/v8009-s1-v4102-qa-system.js js/features/system/beta/v8009-s1-v4106-qa2-performance.js js/features/system/beta/v8009-s1-gl-code-diag.js V8009_SYSTEM_EXTRACTION_BATCH1_QA.json
          git commit -m "V8.009 SYSTEM: extract diagnostics owner batch" || exit 0
          git pull --rebase origin main
          git push