name: V8.009 Shop Repaint Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_shop_repaint_audit.py'
      - '.github/workflows/v8009-shop-repaint-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_shop_repaint_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_SHOP_REPAINT_AUDIT.json
          git commit -m "V8.009 AUDIT: shop repaint inventory" || exit 0
          git pull --rebase origin main
          git push

