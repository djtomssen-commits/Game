name: V8.009 Final Post Sweep Inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_final_post_sweep_inventory.py'
      - '.github/workflows/v8009-final-post-sweep-inventory.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_final_post_sweep_inventory.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_FINAL_POST_SWEEP_INVENTORY.json
          git commit -m "V8.009 FINAL: record post sweep inventory" || exit 0
          git pull --rebase origin main
          git push