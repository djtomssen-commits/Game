name: V8.009 DOM Contract Guard
on:
  push:
    branches: [main]
    paths:
      - 'beta.html'
      - 'js/**'
      - '.github/scripts/v8009_dom_contract_guard.py'
      - '.github/workflows/v8009-dom-contract-guard.yml'
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_dom_contract_guard.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_DOM_CONTRACT_GUARD.json
          git commit -m "V8.009 QA: DOM contract guard" || exit 0
          git pull --rebase origin main
          git push

