name: V8.009 Quest Active Layout Lock
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_quest_active_layout_lock.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Lock active quest geometry in canonical RPG style
        run: python3 .github/scripts/v8009_quest_active_layout_lock.py
      - name: Validate Stable unchanged
        run: git diff --exit-code HEAD -- index.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html V8009_QUEST_ACTIVE_LAYOUT_LOCK.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 QUEST: lock active quest layout"
          git push
