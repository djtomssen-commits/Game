name: V8.009 PvP Hall Profile Chain Extract
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_pvp_hall_profile_chain_extract.py'
      - '.github/workflows/v8009-pvp-hall-profile-chain-extract.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_pvp_hall_profile_chain_extract.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_PVP_HALL_PROFILE_CHAIN.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 PVP: capture Hall profile owner chain"
          git push
