name: V8.009 Character Runtime Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_character_runtime_audit.py'
      - '.github/workflows/v8009-character-runtime-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_character_runtime_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_CHARACTER_RUNTIME_AUDIT.json
          git commit -m "V8.009 CHARACTER: record runtime audit" || exit 0
          git push
