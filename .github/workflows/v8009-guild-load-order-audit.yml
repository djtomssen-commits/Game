name: V8.009 Guild Load Order Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_guild_load_order_audit.py'
      - '.github/workflows/v8009-guild-load-order-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_guild_load_order_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_GUILD_LOAD_ORDER_AUDIT.json
          git commit -m "V8.009 GUILD: record load order audit" || exit 0
          git push
