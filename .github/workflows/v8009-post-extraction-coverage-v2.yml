name: V8.009 Post Extraction Coverage V2
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_post_extraction_coverage_v2.py'
      - '.github/workflows/v8009-post-extraction-coverage-v2.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_post_extraction_coverage_v2.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_POST_EXTRACTION_COVERAGE_V2.json
          git commit -m "V8.009 FINAL: record post extraction coverage v2" || exit 0
          git pull --rebase origin main
          git push