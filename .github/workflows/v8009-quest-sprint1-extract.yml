name: V8.009 Quest Sprint 1 Extract

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_quest_sprint1_extract.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract Quest-owned JS
        run: python3 .github/scripts/v8009_quest_sprint1_extract.py
      - name: Syntax check extracted JS
        run: |
          for f in js/features/quest/beta/*.js; do
            node --check "$f"
          done
      - name: Validate Stable unchanged
        run: git diff --exit-code HEAD -- index.html
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html js/features/quest/beta V8009_QUEST_SPRINT1_EXTRACT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 QUEST-SPRINT-1: extract quest JS"
          git push
