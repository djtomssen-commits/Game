name: V8.009 Dungeon D5 Final Detail Seal

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_dungeon_d5_install_final_seal.py'
      - 'js/features/dungeon/beta/v8009-d5-final-detail-seal.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install final Dungeon detail seal last
        run: python3 .github/scripts/v8009_dungeon_d5_install_final_seal.py
      - name: Syntax check
        run: |
          node --check js/features/dungeon/beta/v8009-d5-final-detail-seal.js
          node --check js/features/dungeon/beta/v8009-d2-visual-owner.js
          node --check js/features/dungeon/beta/v8009-d2-detail-render-lock.js
      - name: Validate final owner seal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          beta=Path('beta.html').read_text(encoding='utf-8')
          stable=Path('index.html').read_text(encoding='utf-8')
          src='js/features/dungeon/beta/v8009-d5-final-detail-seal.js'
          if beta.count(src)!=1: raise SystemExit('seal include count != 1')
          if src in stable: raise SystemExit('stable unexpectedly loads seal')
          body_end=beta.lower().rfind('</body>')
          if beta.rfind('<script',0,body_end)>beta.index(src):
              raise SystemExit('seal not final script')
          r=json.loads(Path('V8009_DUNGEON_D5_FINAL_DETAIL_SEAL.json').read_text(encoding='utf-8'))
          if not r.get('seal_is_last_script') or not r.get('stable_unchanged'):
              raise SystemExit('seal report invalid')
          print('DUNGEON-D5 final detail seal OK')
          PY
      - name: Diff sanity
        run: git diff --check
      - name: Commit final seal install
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html V8009_DUNGEON_D5_FINAL_DETAIL_SEAL.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 DUNGEON-D5: install final canonical detail seal"
          git push
