name: V8.009 Final Batch 2
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_final_batch2.py'
      - '.github/workflows/v8009-final-batch2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_final_batch2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html V8009_FINAL_BATCH2_QA.json
          git commit -m "V8.009 FINAL: retire comparison and attribute startup repaints" || exit 0
          git pull --rebase origin main
          git push