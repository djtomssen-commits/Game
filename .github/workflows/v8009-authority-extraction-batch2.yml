name: V8.009 Authority Extraction Batch 2
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_authority_extraction_batch2.py'
      - '.github/workflows/v8009-authority-extraction-batch2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_authority_extraction_batch2.py
      - run: |
          node --check js/features/authority/beta/v8009-s2-v7133-global-gameplay-authority-lockdown.js
          node --check js/features/authority/beta/v8009-s2-v7065-fail-closed-grow-authority-hotfix.js
          node --check js/features/authority/beta/v8009-s2-v7033-build-authority-bridge.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add beta.html js/features/authority/beta/v8009-s2-v7133-global-gameplay-authority-lockdown.js js/features/authority/beta/v8009-s2-v7065-fail-closed-grow-authority-hotfix.js js/features/authority/beta/v8009-s2-v7033-build-authority-bridge.js V8009_AUTHORITY_EXTRACTION_BATCH2_QA.json
          git commit -m "V8.009 AUTHORITY: extract second bridge batch" || exit 0
          git pull --rebase origin main
          git push