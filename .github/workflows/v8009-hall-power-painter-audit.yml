name: V8.009 Hall Power Painter Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_hall_power_painter_audit.py'
      - '.github/workflows/v8009-hall-power-painter-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_hall_power_painter_audit.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_HALL_POWER_PAINTER_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 PVP: audit Hall profile power painters"
          git push
