name: V8.009 Legacy Owner Overlap Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_legacy_owner_overlap_audit.py'
      - '.github/workflows/v8009-legacy-owner-overlap-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_legacy_owner_overlap_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_LEGACY_OWNER_OVERLAP_AUDIT.json
          git commit -m "V8.009 AUDIT: legacy owner overlap inventory" || exit 0
          git pull --rebase origin main
          git push
