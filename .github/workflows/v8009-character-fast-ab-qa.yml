name: V8.009 Character Fast A B QA
on:
  push:
    branches: [main]
    paths:
      - 'beta.html'
      - '.github/scripts/v8009_character_fast_ab_qa.py'
      - '.github/workflows/v8009-character-fast-ab-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_character_fast_ab_qa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_CHARACTER_FAST_AB_QA.json
          git commit -m "V8.009 CHARACTER: record fast A B QA" || exit 0
          git push
