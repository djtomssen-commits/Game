name: V8.009 Character Reference And Perf Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_character_reference_perf_audit.py'
      - '.github/workflows/v8009-character-reference-perf-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_character_reference_perf_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_CHARACTER_REFERENCE_AND_PERF_AUDIT.json
          git commit -m "V8.009 AUDIT: character reference and performance inventory" || exit 0
          git pull --rebase origin main
          git push

