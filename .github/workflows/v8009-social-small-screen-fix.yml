name: V8.009 Social Small Screen Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_social_small_screen_fix.py'
      - '.github/workflows/v8009-social-small-screen-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_social_small_screen_fix.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add beta.html V8009_SOCIAL_SMALL_SCREEN_QA.json
          git commit -m "V8.009 FINAL: fix legacy mail header route" || exit 0
          git pull --rebase origin main
          git push