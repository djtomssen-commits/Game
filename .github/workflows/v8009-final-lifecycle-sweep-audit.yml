name: V8.009 Final Lifecycle Sweep Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_final_lifecycle_sweep_audit.py'
      - '.github/workflows/v8009-final-lifecycle-sweep-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_final_lifecycle_sweep_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_FINAL_LIFECYCLE_SWEEP_AUDIT.json
          git commit -m "V8.009 FINAL: record lifecycle sweep audit" || exit 0
          git pull --rebase origin main
          git push
