name: V8.009 Hall Frame Helpers Extract
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_hall_frame_helpers_extract.py'
      - '.github/workflows/v8009-hall-frame-helpers-extract.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_hall_frame_helpers_extract.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_HALL_FRAME_HELPERS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 PVP: inspect Hall frame helpers"
          git push
