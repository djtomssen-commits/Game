name: V8.009 Dungeon Activity Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_dungeon_activity_audit.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit dungeon activity chain
        run: python3 .github/scripts/v8009_dungeon_activity_audit.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_DUNGEON_ACTIVITY_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 DUNGEON: audit activity reward chain"
          git push
