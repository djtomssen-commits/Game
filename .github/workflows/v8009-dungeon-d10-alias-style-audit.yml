name: V8.009 Dungeon D10 Alias Style Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_dungeon_d10_alias_style_audit.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Audit aliases and D1 styles
        run: python3 .github/scripts/v8009_dungeon_d10_alias_style_audit.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_DUNGEON_D10_ALIAS_STYLE_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 DUNGEON-D10: audit detail aliases and D1 styles"
          git push
