name: V8.009 Quest v496 Direct Hook QA
on:
  push:
    branches: [main]
    paths:
      - 'js/features/quest/beta/v496-quest-claim-single-payout.js'
      - 'js/features/quest/beta/v235-quest-reward-stability.js'
      - 'js/features/quest/beta/v099-real-quest-xp-fix.js'
      - '.github/scripts/v8009_quest_v496_direct_hook_qa.py'
      - '.github/workflows/v8009-quest-v496-direct-hook-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check js/features/quest/beta/v496-quest-claim-single-payout.js
          node --check js/features/quest/beta/v235-quest-reward-stability.js
          node --check js/features/quest/beta/v099-real-quest-xp-fix.js
      - run: python3 .github/scripts/v8009_quest_v496_direct_hook_qa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_V496_DIRECT_HOOK_QA.json
          git commit -m "V8.009 QUEST: record v496 direct-hook QA" || exit 0
          git push
