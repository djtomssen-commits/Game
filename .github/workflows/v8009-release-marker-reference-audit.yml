name: V8.009 Release Marker Reference Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_release_marker_reference_audit.py'
      - '.github/workflows/v8009-release-marker-reference-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_release_marker_reference_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_RELEASE_MARKER_REFERENCE_AUDIT.json
          git commit -m "V8.009 AUDIT: release marker references" || exit 0
          git pull --rebase origin main
          git push

