name: V8 Phase 3C11 boss wrapper audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8_phase3c11_boss_audit.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8_phase3c11_boss_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8_PHASE3C11_BOSS_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit remaining beta guild boss wrappers"
          git push
