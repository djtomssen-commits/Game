name: V8.009 Social Admin Patch Context
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_social_admin_patch_context.py'
      - '.github/workflows/v8009-social-admin-patch-context.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_social_admin_patch_context.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_SOCIAL_ADMIN_PATCH_CONTEXT.json
          git commit -m "V8.009 FINAL: record social admin patch context" || exit 0
          git pull --rebase origin main
          git push