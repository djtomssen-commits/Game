name: V8.009 Dungeon Sprint 2 Final Owner Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_dungeon_sprint2_final_owner_audit.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Audit remaining Dungeon owner assignments
        run: python3 .github/scripts/v8009_dungeon_sprint2_final_owner_audit.py
      - name: Validate retired owners stay retired
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('V8009_DUNGEON_SPRINT2_FINAL_OWNER_AUDIT.json').read_text(encoding='utf-8'))
          if r['retired_owner_ids_still_active']:
              raise SystemExit('retired owners active: '+','.join(r['retired_owner_ids_still_active']))
          print('Dungeon Sprint 2 final owner audit complete')
          PY
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_DUNGEON_SPRINT2_FINAL_OWNER_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 DUNGEON-SPRINT-2: audit remaining owner assignments"
          git push
