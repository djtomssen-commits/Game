name: V8.383 Unified Flight Recorder QA
on:
  push:
    branches: [main]
    paths:
      - 'js/features/system/beta/v8383-unified-flight-recorder.js'
      - 'js/features/core/beta/v8009-a1-legacy-state-core.js'
      - 'js/features/system/beta/v8009-s1-v4107-systemtechnik.js'
      - 'js/features/system/beta/v8009-s7-v7092-runtime-watchdog.js'
      - 'qa/v8383-flight-recorder-guard.mjs'
      - 'qa/v8385-phase-aware-watchdog.mjs'
      - 'qa/v8386-authorized-attribute-changes.mjs'
      - 'js/features/character/beta/v8009-s1-v4140-attribute-display-owner.js'
      - 'js/features/authority/beta/v8009-s6-v7062-server-item-action-bridge.js'
      - 'beta.html'
      - 'server1.html'
      - '.github/workflows/v8383-flight-recorder-qa.yml'
  workflow_dispatch:
jobs:
  recorder-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check security, isolation, and real diagnostic grouping
        run: |
          node qa/v8383-flight-recorder-guard.mjs
          node qa/v8385-phase-aware-watchdog.mjs
          node qa/v8386-authorized-attribute-changes.mjs
