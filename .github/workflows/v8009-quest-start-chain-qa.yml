name: V8.009 Quest Start Chain QA
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_quest_start_chain_qa.py'
      - 'js/features/quest/beta/v321-elite-hard-guarantee-dampf-scale.js'
      - 'js/features/quest/beta/v443-quest-dampf-live-fix.js'
      - 'js/features/quest/beta/v7110-quest-authority-sync.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check js/features/quest/beta/v321-elite-hard-guarantee-dampf-scale.js
          node --check js/features/quest/beta/v443-quest-dampf-live-fix.js
          node --check js/features/quest/beta/v7110-quest-authority-sync.js
      - name: Contract QA
        run: python3 .github/scripts/v8009_quest_start_chain_qa.py
      - name: Commit QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_START_CHAIN_QA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 QUEST: record start chain QA"
          git push
