name: V8.009 Event Bus Order Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_event_bus_order_audit.py'
      - '.github/workflows/v8009-event-bus-order-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_event_bus_order_audit.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_EVENT_BUS_ORDER_AUDIT.json
          git commit -m "V8.009 AUDIT: event bus load order" || exit 0
          git pull --rebase origin main
          git push
