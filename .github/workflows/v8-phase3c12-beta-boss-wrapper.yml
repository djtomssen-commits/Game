name: V8 Phase 3C12 Beta guild boss late wrapper
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8_phase3c12_beta_boss_wrapper.py'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate late guild boss refresh and QA bridge
        run: python3 .github/scripts/v8_phase3c12_beta_boss_wrapper.py
      - name: Syntax-check owner
        run: node --check js/features/guild/beta/v8008-c12-guildboss-runtime-core.js
      - name: Validate beta-only scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          beta=Path('beta.html').read_text(encoding='utf-8')
          report=json.loads(Path('V8_PHASE3C12_BETA.json').read_text(encoding='utf-8'))
          if not report.get('stable_unchanged'):
              raise SystemExit('stable changed')
          core=re.search(r'<script\b[^>]*\bid=["\']v260-real-daily-guild-boss["\'][^>]*>',beta,re.I)
          if not core or 'js/features/guild/beta/v8008-c12-guildboss-runtime-core.js' not in core.group(0):
              raise SystemExit('C12 runtime core not loaded')
          late=re.search(r'<script\b[^>]*\bid=["\']v4118-care-guildboss-fix["\'][^>]*>[\s\S]*?</script\s*>',beta,re.I)
          if not late or 'v8008C12InstallLateBridge' not in late.group(0):
              raise SystemExit('C12 late bridge call missing')
          if re.search(r'\bsrc=',late.group(0),re.I):
              raise SystemExit('legacy v4118 file still loads on beta')
          s=Path('js/features/guild/beta/v8008-c12-guildboss-runtime-core.js').read_text(encoding='utf-8')
          for token in ('v8008C12InstallLateBridge','refreshBoss','qaWrap','v4114DecorateCareSlots'):
              if token not in s: raise SystemExit(f'C12 owner missing {token}')
          print('Phase 3C12 validation OK')
          PY
      - name: Commit beta-only wrapper consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html js/features/guild/beta/v8008-c12-guildboss-runtime-core.js V8_PHASE3C12_BETA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.008 beta Phase 3C12: consolidate guild boss late wrapper"
          git push
