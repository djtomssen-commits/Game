name: V8.009 Character Fast Patch C
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_character_fast_patch_c.py'
      - '.github/workflows/v8009-character-fast-patch-c.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_character_fast_patch_c.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html
          git commit -m "V8.009 CHARACTER: make hero inventory lifecycle direct" || exit 0
          git push
