name: V8.009 Dungeon D12 CSS Cascade Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_dungeon_d12_css_cascade_audit.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Audit D1 CSS cascade
        run: python3 .github/scripts/v8009_dungeon_d12_css_cascade_audit.py
      - name: Validate audit coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('V8009_DUNGEON_D12_CSS_CASCADE_AUDIT.json').read_text(encoding='utf-8'))
          if len(r.get('source_order',[]))!=11: raise SystemExit('D12 source order count != 11')
          if len(r.get('file_stats',[]))!=11: raise SystemExit('D12 file stats count != 11')
          total=sum(x['declarations'] for x in r['file_stats'])
          classified=r['proven_redundant_declaration_count']+r['still_effective_or_unproven_count']
          if total!=classified: raise SystemExit(f'D12 classification mismatch: {total} != {classified}')
          print('D12 cascade audit coverage OK')
          PY
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_DUNGEON_D12_CSS_CASCADE_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 DUNGEON-D12: audit D1 CSS cascade redundancy"
          git push
