name: V8.009 Grow Forge Extraction Batch 1
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_grow_forge_extraction_batch1.py'
      - '.github/workflows/v8009-grow-forge-extraction-batch1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_grow_forge_extraction_batch1.py
      - run: |
          node --check js/features/grow/beta/v8009-s1-v492-growroom2.js
          node --check js/features/grow/beta/v8009-s1-v6160-grow-contracts-core.js
          node --check js/features/forge/beta/v8009-s1-v488-harzschmiede-core.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add beta.html js/features/grow/beta/v8009-s1-v492-growroom2.js js/features/grow/beta/v8009-s1-v6160-grow-contracts-core.js js/features/forge/beta/v8009-s1-v488-harzschmiede-core.js V8009_GROW_FORGE_EXTRACTION_BATCH1_QA.json
          git commit -m "V8.009 GROW FORGE: extract first owner batch" || exit 0
          git pull --rebase origin main
          git push