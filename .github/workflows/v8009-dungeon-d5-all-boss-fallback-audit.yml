name: V8.009 Dungeon D5 All Boss Fallback Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_dungeon_d5_all_boss_fallback_audit.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Audit all boss fallbacks
        run: python3 .github/scripts/v8009_dungeon_d5_all_boss_fallback_audit.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_DUNGEON_D5_ALL_BOSS_FALLBACK_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 DUNGEON-D5: audit boss fallbacks across all dungeons"
          git push
