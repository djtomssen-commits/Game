name: V8 Phase 3C9 Beta guild boss screen owner
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8_phase3c9_beta_boss_screen.py'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build beta guild boss screen owner
        run: python3 .github/scripts/v8_phase3c9_beta_boss_screen.py
      - name: Syntax-check owner
        run: node --check js/features/guild/beta/v8008-c9-guildboss-screen-owner.js
      - name: Validate beta-only install timing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          beta=Path('beta.html').read_text(encoding='utf-8')
          report=json.loads(Path('V8_PHASE3C9_BETA.json').read_text(encoding='utf-8'))
          if not report.get('stable_unchanged'):
              raise SystemExit('stable changed')
          early=re.search(r'<script\b[^>]*\bid=["\']v414-guild-boss-longterm["\'][^>]*>[\s\S]*?</script\s*>',beta,re.I)
          late=re.search(r'<script\b[^>]*\bid=["\']v562-guild-boss-reference-js["\'][^>]*>[\s\S]*?</script\s*>',beta,re.I)
          if not early or 'js/features/guild/beta/v8008-c9-guildboss-screen-owner.js' not in early.group(0):
              raise SystemExit('C9 screen owner not loaded at v414 position')
          if not late or 'v8008C9InstallReferenceLayout' not in late.group(0):
              raise SystemExit('late v562 installer call missing')
          if re.search(r'\bsrc=',late.group(0),re.I):
              raise SystemExit('legacy v562 external load still active')
          if early.start()>=late.start():
              raise SystemExit('C9 install order invalid')
          print('Phase 3C9 validation OK')
          PY
      - name: Commit beta-only screen owner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html js/features/guild/beta/v8008-c9-guildboss-screen-owner.js V8_PHASE3C9_BETA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.008 beta Phase 3C9: consolidate guild boss screen owner"
          git push
