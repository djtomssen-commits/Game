name: V8.009 Quest v7046 Order Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_quest_v7046_order_audit.py'
      - '.github/workflows/v8009-quest-v7046-order-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_quest_v7046_order_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_V7046_ORDER_AUDIT.json
          git commit -m "V8.009 QUEST: record v7046 order audit" || exit 0
          git push
