name: V8.009 Shop Legacy Top Cleanup QA
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_shop_legacy_top_cleanup_qa.py'
      - '.github/workflows/v8009-shop-legacy-top-cleanup-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_shop_legacy_top_cleanup_qa.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_SHOP_LEGACY_TOP_CLEANUP_QA.json
          git commit -m "V8.009 QA: shop legacy top cleanup" || exit 0
          git pull --rebase origin main
          git push
