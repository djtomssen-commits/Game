name: V8.009 Character Material Performance Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_character_material_perf_fix.py'
      - '.github/workflows/v8009-character-material-perf-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_character_material_perf_fix.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add beta.html V8009_CHARACTER_MATERIAL_PERF_QA.json
          git commit -m "V8.009 CHARACTER: smooth material tab render lifecycle" || exit 0
          git pull --rebase origin main
          git push