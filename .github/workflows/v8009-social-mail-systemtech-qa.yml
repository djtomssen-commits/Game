name: V8.009 Social Mail Systemtech QA
on:
  push:
    branches: [main]
    paths:
      - 'beta.html'
      - '.github/scripts/v8009_social_mail_systemtech_qa.py'
      - '.github/workflows/v8009-social-mail-systemtech-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_social_mail_systemtech_qa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_SOCIAL_MAIL_SYSTEMTECH_QA.json
          git commit -m "V8.009 SOCIAL: record mail friends systemtech QA" || exit 0
          git push
