name: V8 Beta guild asset URL audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8_beta_guild_asset_audit.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit extracted guild CSS asset URLs
        run: python3 .github/scripts/v8_beta_guild_asset_audit.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8_BETA_GUILD_ASSET_URL_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit guild CSS asset URLs after extraction"
          git push
