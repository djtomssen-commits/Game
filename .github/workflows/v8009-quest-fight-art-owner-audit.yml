name: V8.009 Quest Fight Art Owner Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_quest_fight_art_owner_audit.py'
      - '.github/workflows/v8009-quest-fight-art-owner-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_quest_fight_art_owner_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_FIGHT_ART_OWNER_AUDIT.json
          git commit -m "V8.009 QUEST: record fight art owner audit" || exit 0
          git push
