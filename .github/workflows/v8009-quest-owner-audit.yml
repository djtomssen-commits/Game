name: V8.009 Quest Owner Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_quest_owner_audit.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Audit quest owner chain
        run: python3 .github/scripts/v8009_quest_owner_audit.py
      - name: Validate audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('V8009_QUEST_OWNER_AUDIT.json').read_text(encoding='utf-8'))
          for name in ('renderQuests','startQuest','claimQuest'):
              if not r['symbols'][name]:
                  raise SystemExit(f'no writers for {name}')
          print('Quest owner audit OK')
          PY
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_QUEST_OWNER_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 QUEST-SPRINT-1: audit quest owner chain"
          git push
