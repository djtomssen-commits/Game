name: V8.009 PvP Runtime Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_pvp_runtime_audit.py'
      - '.github/workflows/v8009-pvp-runtime-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_pvp_runtime_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_PVP_RUNTIME_AUDIT.json
          git commit -m "V8.009 PVP: record runtime audit" || exit 0
          git push
