name: V8.009 Hall Late Frame CSS Extract
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_hall_late_frame_css_extract.py'
      - '.github/workflows/v8009-hall-late-frame-css-extract.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_hall_late_frame_css_extract.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_HALL_LATE_FRAME_CSS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 PVP: inspect late Hall frame CSS owners"
          git push
