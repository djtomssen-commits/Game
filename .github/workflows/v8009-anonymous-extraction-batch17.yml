name: V8.009 Anonymous Extraction Batch 17
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_anonymous_extraction_batch17.py'
      - '.github/workflows/v8009-anonymous-extraction-batch17.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_anonymous_extraction_batch17.py
      - run: |
          find js/features -type f -name 'v8009-a1-*.js' -print0 | xargs -0 -r -n1 node --check
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add beta.html js/features V8009_ANONYMOUS_EXTRACTION_BATCH17_QA.json
          git commit -m "V8.009 FEATURES: extract anonymous batch17" || exit 0
          git pull --rebase origin main
          git push
