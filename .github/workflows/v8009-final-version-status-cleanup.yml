name: V8.009 Final Version Status Cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_final_version_status_cleanup.py'
      - '.github/workflows/v8009-final-version-status-cleanup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_final_version_status_cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html V8009_FINAL_VERSION_STATUS_QA.json
          git commit -m "V8.009 FINAL: retire version status retry trains" || exit 0
          git pull --rebase origin main
          git push