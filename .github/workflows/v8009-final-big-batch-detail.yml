name: V8.009 Final Big Batch Detail
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_final_big_batch_detail.py'
      - '.github/workflows/v8009-final-big-batch-detail.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_final_big_batch_detail.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V8009_FINAL_BIG_BATCH_DETAIL.json
          git commit -m "V8.009 FINAL: record big batch detail" || exit 0
          git pull --rebase origin main
          git push