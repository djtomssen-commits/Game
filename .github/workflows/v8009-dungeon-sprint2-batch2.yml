name: V8.009 Dungeon Sprint 2 Batch 2

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_dungeon_sprint2_batch2_direct_hooks.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace v4165 and v7051 render wrappers with direct hooks
        run: python3 .github/scripts/v8009_dungeon_sprint2_batch2_direct_hooks.py

      - name: Syntax-check modified inline scripts and canonical owner
        run: |
          node --check js/features/dungeon/beta/v8009-d2-visual-owner.js
          node --check js/features/dungeon/beta/v8009-d5-final-detail-seal.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          beta=Path('beta.html').read_text(encoding='utf-8')
          for sid in ('v4165-dungeon-key-live-battle-index-fix','v7051-atomic-dungeon-receipt-client'):
              m=re.search(r'<script[^>]*id=["\']'+re.escape(sid)+r'["\'][^>]*>([\s\S]*?)</script\s*>',beta,re.I)
              if not m: raise SystemExit(f'missing inline script: {sid}')
              Path('/tmp/'+sid+'.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v4165-dungeon-key-live-battle-index-fix.js
          node --check /tmp/v7051-atomic-dungeon-receipt-client.js

      - name: Validate direct-hook contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          beta=Path('beta.html').read_text(encoding='utf-8')
          owner=Path('js/features/dungeon/beta/v8009-d2-visual-owner.js').read_text(encoding='utf-8')
          r=json.loads(Path('V8009_DUNGEON_SPRINT2_BATCH2.json').read_text(encoding='utf-8'))

          for needle in (
              'window.v4165StampDetail?.()',
              "window.v4165SyncBattleGate?.('canonical-render')",
              'window.v7051ClaimButtonSync?.()',
          ):
              if needle not in owner:
                  raise SystemExit(f'canonical direct hook missing: {needle}')

          for forbidden in ('__v4165DetailStamp','__v4165BattleGate','__v7051ButtonOwner','__v7051Base'):
              if forbidden in beta:
                  raise SystemExit(f'redundant wrapper marker still active: {forbidden}')

          for required in (
              'window.v4165StampDetail=stampDetail',
              'window.v4165SyncBattleGate=syncBattleGate',
              'window.v7051ClaimButtonSync=claimButton',
              'window.v7051RunServerDungeon=()=>runServerDungeon()',
              'wrapped.__v4165BattleSync=true',
          ):
              if required not in beta:
                  raise SystemExit(f'critical retained logic missing: {required}')

          if not r.get('stable_unchanged'):
              raise SystemExit('Stable scope failed')
          print('DUNGEON SPRINT 2 BATCH 2 direct-hook QA OK')
          PY

      - name: Diff sanity
        run: git diff --check

      - name: Commit Sprint 2 Batch 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html V8009_DUNGEON_SPRINT2_BATCH2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.009 DUNGEON-SPRINT-2: direct-hook v4165 and v7051"
          git push
