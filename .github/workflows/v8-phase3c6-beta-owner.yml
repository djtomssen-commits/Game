name: V8 Phase 3C6 Beta merge guild load gate
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8_phase3c6_beta_owner.py'
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge beta guild load gate into overview owner
        run: python3 .github/scripts/v8_phase3c6_beta_owner.py
      - name: Syntax-check merged owner
        run: node --check js/features/guild/beta/v8008-c6-guild-overview-owner.js
      - name: Validate beta-only owner chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          beta=Path('beta.html').read_text(encoding='utf-8')
          report=json.loads(Path('V8_PHASE3C6_BETA.json').read_text(encoding='utf-8'))
          if not report.get('stable_unchanged'):
              raise SystemExit('stable changed')
          owner=re.search(r'<script\b[^>]*\bid=["\']v554-guild-reference-owner-js["\'][^>]*>',beta,re.I)
          if not owner or 'js/features/guild/beta/v8008-c6-guild-overview-owner.js' not in owner.group(0):
              raise SystemExit('C6 beta owner not loaded')
          old=re.search(r'<script\b[^>]*\bid=["\']v561-guild-first-open-gate-js["\'][^>]*>',beta,re.I)
          if not old: raise SystemExit('v561 compatibility marker missing')
          if re.search(r'\bsrc=',old.group(0),re.I): raise SystemExit('v561 still loads on beta')
          merged=Path('js/features/guild/beta/v8008-c6-guild-overview-owner.js').read_text(encoding='utf-8')
          for token in ('v561GuildLoading','__v561GuildLoadGate','__v561GuildGoGate','ensureGuildProgress','syncEmptyRequests'):
              if token not in merged: raise SystemExit(f'merged owner missing {token}')
          print('Phase 3C6 validation OK')
          PY
      - name: Commit beta-only owner merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta.html js/features/guild/beta/v8008-c6-guild-overview-owner.js V8_PHASE3C6_BETA.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V8.008 beta Phase 3C6: merge guild load gate into overview owner"
          git push
