name: V8.009 Quest Completion Event QA
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v8009_quest_completion_event_qa.py'
      - '.github/workflows/v8009-quest-completion-event-qa.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/v8009_quest_completion_event_qa.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add V8009_QUEST_COMPLETION_EVENT_QA.json
          git commit -m "V8.009 QA: quest completion event migration" || exit 0
          git pull --rebase origin main
          git push

